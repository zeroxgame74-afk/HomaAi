<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomaAi - هوش مصنوعی کامل</title>
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <!-- فونت وزیر -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #0b0d15;
            color: #f0f3fa;
            font-family: 'Vazir', sans-serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
            overflow: hidden;
        }

        .homa-container {
            width: 100%;
            max-width: 1400px;
            height: 100vh;
            padding: 2rem 2rem 1.5rem;
            background: radial-gradient(circle at 20% 30%, #1a1e2f, #0b0d15 80%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* افکت پس‌زمینه */
        .homa-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -30%;
            width: 120%;
            height: 150%;
            background: radial-gradient(circle, rgba(70, 130, 255, 0.05), transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        /* هدر */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            font-size: 2.5rem;
            color: #4a7cff;
            filter: drop-shadow(0 0 20px #4a7cff66);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .logo-text {
            font-size: 2rem;
            background: linear-gradient(135deg, #b0caff, #6a9aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(74, 124, 255, 0.15);
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-size: 0.85rem;
            color: #8aafff;
            border: 1px solid rgba(74, 124, 255, 0.2);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* بخش چت */
        .chat-area {
            flex: 1;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(74, 124, 255, 0.3);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.5rem;
            border-radius: 20px;
            animation: slideIn 0.3s ease-out;
            line-height: 1.8;
            font-weight: 400;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #2a3a6a, #1a2a5a);
            border: 1px solid rgba(74, 124, 255, 0.2);
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .message.ai .typing-indicator {
            display: flex;
            gap: 0.5rem;
            padding: 0.3rem 0;
        }

        .message.ai .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #4a7cff;
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }

        .message.ai .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .message.ai .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* ورودی */
        .input-area {
            display: flex;
            gap: 1rem;
            padding: 0.5rem 0;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 60px;
            padding: 1rem 1.8rem;
            color: #f0f6ff;
            font-family: 'Vazir', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .input-area input:focus {
            border-color: rgba(74, 124, 255, 0.4);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 30px rgba(74, 124, 255, 0.05);
        }

        .input-area input::placeholder {
            color: #6b7ca8;
            font-weight: 400;
        }

        .input-area button {
            background: linear-gradient(135deg, #3a6aff, #1f4ad0);
            border: none;
            border-radius: 60px;
            padding: 0 2rem;
            color: #fff;
            font-family: 'Vazir', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 40px rgba(58, 106, 255, 0.2);
            white-space: nowrap;
        }

        .input-area button:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 60px rgba(58, 106, 255, 0.4);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* فوتر */
        .footer {
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 1rem;
            margin-top: 0.5rem;
            color: #7a8bb8;
            font-weight: 400;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .footer-social i {
            font-size: 1.4rem;
            margin-left: 1rem;
            color: #6678a3;
            transition: 0.25s;
            cursor: default;
        }
        .footer-social i:hover {
            color: #a3bcf5;
            transform: translateY(-2px);
        }

        /* ریسپانسیو */
        @media (max-width: 700px) {
            .homa-container { padding: 1rem; }
            .logo-text { font-size: 1.5rem; }
            .status-badge { font-size: 0.7rem; padding: 0.3rem 0.8rem; }
            .message { max-width: 95%; font-size: 0.95rem; padding: 0.8rem 1.2rem; }
            .input-area button { padding: 0 1.2rem; font-size: 0.9rem; }
            .input-area input { font-size: 0.9rem; padding: 0.8rem 1.2rem; }
            .footer { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="homa-container">
        <!-- هدر -->
        <header class="header">
            <div class="logo-area">
                <i class="fas fa-brain logo-icon"></i>
                <span class="logo-text">HomaAi</span>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span id="statusText">آماده</span>
            </div>
        </header>

        <!-- بخش چت -->
        <section class="chat-area">
            <div class="messages-container" id="messagesContainer">
                <div class="message ai">
                    <i class="fas fa-robot" style="margin-left: 0.5rem; color: #4a7cff;"></i>
                    سلام! من HomaAi هستم. هر سوالی داری، بپرس! 🤖
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="سوالت رو اینجا بپرس..." />
                <button id="sendButton">
                    <i class="fas fa-paper-plane"></i> بفرست
                </button>
            </div>
        </section>

        <!-- فوتر -->
        <footer class="footer">
            <div class="footer-social">
                <i class="fab fa-twitter"></i>
                <i class="fab fa-github"></i>
                <i class="fab fa-linkedin"></i>
            </div>
            <div>
                <i class="fas fa-microchip"></i> مغز: Transformer.js
            </div>
        </footer>
    </div>

    <!-- ============ مغز هوش مصنوعی ============ -->
    <script type="importmap">
        {
            "imports": {
                "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2"
            }
        }
    </script>

    <script type="module">
        import { pipeline, env } from '@xenova/transformers';

        // تنظیمات
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        // المان‌ها
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const statusText = document.getElementById('statusText');

        let isProcessing = false;
        let chatHistory = [];

        // ============= مدل هوش مصنوعی =============
        let generator = null;

        async function loadModel() {
            try {
                statusText.textContent = 'در حال بارگذاری مغز...';
                statusText.style.color = '#fbbf24';
                sendButton.disabled = true;

                // استفاده از مدل Phi-3-mini (سبک و قدرتمند)
                generator = await pipeline('text-generation', 'Xenova/phi-3-mini-4k-instruct', {
                    quantized: true,
                    progress_callback: (progress) => {
                        if (progress.status === 'downloading') {
                            statusText.textContent = `دانلود ${Math.round(progress.progress * 100)}%`;
                        }
                    }
                });

                statusText.textContent = 'آنلاین ✅';
                statusText.style.color = '#4ade80';
                sendButton.disabled = false;
                
                // پیام خوش‌آمدگویی دوباره
                addMessage('ai', 'مغز من فعال شد! الان می‌تونم به هر سوالی جواب بدم 🚀');
                
            } catch (error) {
                console.error('خطا در بارگذاری مدل:', error);
                statusText.textContent = 'خطا در بارگذاری';
                statusText.style.color = '#ef4444';
                addMessage('ai', '❌ متاسفانه مغز من نتونست بارگذاری بشه. لطفاً صفحه رو رفرش کن.');
            }
        }

        // ============= تولید پاسخ =============
        async function generateResponse(userMessage) {
            if (!generator) {
                return '⏳ مغزم هنوز آماده نشده! چند لحظه صبر کن...';
            }

            try {
                // ساخت پرامپت با تاریخچه
                const systemPrompt = `شما یک دستیار هوشمند به نام HomaAi هستید. 
                به فارسی پاسخ دهید. 
                مختصر، مفید و دقیق باشید.
                اگر پاسخ نمی‌دانید، بگویید نمی‌دانم.
                تاریخچه مکالمه:
                ${chatHistory.slice(-5).map(msg => `${msg.role}: ${msg.content}`).join('\n')}
                `;

                const prompt = `<|system|>
                ${systemPrompt}
                <|user|>
                ${userMessage}
                <|assistant|>`;

                const result = await generator(prompt, {
                    max_new_tokens: 512,
                    temperature: 0.7,
                    top_k: 50,
                    top_p: 0.95,
                    repetition_penalty: 1.1,
                    do_sample: true,
                });

                // استخراج پاسخ
                const response = result[0]?.generated_text || 'عذر می‌خوام، نتونستم جواب بدم.';
                
                // حذف پرامپت از پاسخ
                let cleanResponse = response.replace(prompt, '').trim();
                if (!cleanResponse) {
                    cleanResponse = 'پاسخی دریافت نشد. لطفاً دوباره سوال کن.';
                }

                return cleanResponse;

            } catch (error) {
                console.error('خطا در تولید پاسخ:', error);
                return '⚠️ خطایی در پردازش رخ داد. لطفاً دوباره تلاش کن.';
            }
        }

        // ============= مدیریت پیام‌ها =============
        function addMessage(type, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            if (type === 'ai') {
                messageDiv.innerHTML = `<i class="fas fa-robot" style="margin-left: 0.5rem; color: #4a7cff;"></i> ${content}`;
            } else {
                messageDiv.innerHTML = `<i class="fas fa-user" style="margin-left: 0.5rem; color: #8aafff;"></i> ${content}`;
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            // ذخیره تاریخچه
            chatHistory.push({ role: type === 'user' ? 'user' : 'assistant', content });
            if (chatHistory.length > 20) {
                chatHistory = chatHistory.slice(-20);
            }
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        // ============= ارسال پیام =============
        async function handleSend() {
            const message = userInput.value.trim();
            if (!message || isProcessing || !generator) return;

            // اضافه کردن پیام کاربر
            addMessage('user', message);
            userInput.value = '';
            isProcessing = true;
            sendButton.disabled = true;

            // نمایش تایپینگ
            showTyping();

            try {
                const response = await generateResponse(message);
                removeTyping();
                addMessage('ai', response);
            } catch (error) {
                removeTyping();
                addMessage('ai', '❌ خطا در پردازش درخواست. لطفاً دوباره تلاش کن.');
                console.error(error);
            } finally {
                isProcessing = false;
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        // ============= رویدادها =============
        sendButton.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // ============= بارگذاری مدل =============
        loadModel();

        // ============= تست اولیه =============
        setTimeout(() => {
            if (!generator) {
                // اگر مدل هنوز بارگذاری نشده، پیام بده
                addMessage('ai', '⏳ در حال آماده‌سازی مغز... لطفاً چند ثانیه صبر کن.');
            }
        }, 2000);

        console.log('🧠 HomaAi مغز هوش مصنوعی آماده شد!');
        console.log('🤖 مدل: Phi-3-mini-4k-instruct');
    </script>
</body>
</html>
