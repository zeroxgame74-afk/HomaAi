<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomaAi - هوش مصنوعی سریع</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #0b0d15;
            color: #f0f3fa;
            font-family: 'Vazir', sans-serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
        }

        .homa-container {
            width: 100%;
            max-width: 1400px;
            height: 100vh;
            padding: 1.5rem;
            background: radial-gradient(circle at 20% 30%, #1a1e2f, #0b0d15 80%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .homa-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -30%;
            width: 120%;
            height: 150%;
            background: radial-gradient(circle, rgba(70, 130, 255, 0.05), transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.8rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            font-size: 2.5rem;
            color: #4a7cff;
            filter: drop-shadow(0 0 20px #4a7cff66);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .logo-text {
            font-size: 2rem;
            background: linear-gradient(135deg, #b0caff, #6a9aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(74, 124, 255, 0.15);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            font-size: 0.8rem;
            color: #8aafff;
            border: 1px solid rgba(74, 124, 255, 0.2);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fbbf24;
            animation: blink 1.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .chat-area {
            flex: 1;
            z-index: 2;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(74, 124, 255, 0.3);
            border-radius: 10px;
        }

        .message {
            max-width: 85%;
            padding: 0.8rem 1.2rem;
            border-radius: 18px;
            animation: slideIn 0.3s ease-out;
            line-height: 1.8;
            font-weight: 400;
            font-size: 0.95rem;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #2a3a6a, #1a2a5a);
            border: 1px solid rgba(74, 124, 255, 0.2);
        }

        .message.ai {
            align-self: flex-start;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .message.ai .typing-indicator {
            display: flex;
            gap: 0.4rem;
            padding: 0.2rem 0;
        }

        .message.ai .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #4a7cff;
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }

        .message.ai .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .message.ai .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .input-area {
            display: flex;
            gap: 0.8rem;
            padding: 0.3rem 0;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 60px;
            padding: 0.8rem 1.5rem;
            color: #f0f6ff;
            font-family: 'Vazir', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .input-area input:focus {
            border-color: rgba(74, 124, 255, 0.4);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 30px rgba(74, 124, 255, 0.05);
        }

        .input-area input::placeholder {
            color: #6b7ca8;
            font-weight: 400;
        }

        .input-area button {
            background: linear-gradient(135deg, #3a6aff, #1f4ad0);
            border: none;
            border-radius: 60px;
            padding: 0 1.5rem;
            color: #fff;
            font-family: 'Vazir', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 40px rgba(58, 106, 255, 0.2);
            white-space: nowrap;
        }

        .input-area button:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 60px rgba(58, 106, 255, 0.4);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer {
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 0.8rem;
            margin-top: 0.5rem;
            color: #7a8bb8;
            font-weight: 400;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .footer-social i {
            font-size: 1.2rem;
            margin-left: 0.8rem;
            color: #6678a3;
            transition: 0.25s;
            cursor: default;
        }
        .footer-social i:hover {
            color: #a3bcf5;
            transform: translateY(-2px);
        }

        @media (max-width: 700px) {
            .homa-container { padding: 1rem; }
            .logo-text { font-size: 1.5rem; }
            .status-badge { font-size: 0.7rem; padding: 0.2rem 0.8rem; }
            .message { max-width: 95%; font-size: 0.9rem; padding: 0.7rem 1rem; }
            .input-area button { padding: 0 1rem; font-size: 0.85rem; }
            .input-area input { font-size: 0.85rem; padding: 0.7rem 1rem; }
            .footer { flex-direction: column; align-items: flex-start; gap: 0.3rem; }
        }
    </style>
</head>
<body>
    <div class="homa-container">
        <header class="header">
            <div class="logo-area">
                <i class="fas fa-brain logo-icon"></i>
                <span class="logo-text">HomaAi</span>
            </div>
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">راه‌اندازی...</span>
            </div>
        </header>

        <section class="chat-area">
            <div class="messages-container" id="messagesContainer">
                <div class="message ai">
                    <i class="fas fa-robot" style="margin-left: 0.5rem; color: #4a7cff;"></i>
                    سلام! من HomaAi هستم. دارم مغزم رو آماده می‌کنم... ⏳
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="userInput" placeholder="سوالت رو اینجا بپرس..." disabled />
                <button id="sendButton" disabled>
                    <i class="fas fa-paper-plane"></i> بفرست
                </button>
            </div>
        </section>

        <footer class="footer">
            <div class="footer-social">
                <i class="fab fa-twitter"></i>
                <i class="fab fa-github"></i>
                <i class="fab fa-linkedin"></i>
            </div>
            <div>
                <i class="fas fa-microchip"></i> مغز: GPT-2 (سبک)
            </div>
        </footer>
    </div>

    <!-- ============ مغز هوش مصنوعی (نسخه سریع) ============ -->
    <script type="importmap">
        {
            "imports": {
                "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2"
            }
        }
    </script>

    <script type="module">
        import { pipeline, env } from '@xenova/transformers';

        // تنظیمات برای سرعت بیشتر
        env.allowLocalModels = false;
        env.useBrowserCache = true;
        env.localModelPath = '/models/';

        // المان‌ها
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        let isProcessing = false;
        let chatHistory = [];
        let generator = null;
        let isModelReady = false;

        // ============= پیام‌ها =============
        function addMessage(type, content, isSystem = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            if (type === 'ai') {
                messageDiv.innerHTML = `<i class="fas fa-robot" style="margin-left: 0.5rem; color: #4a7cff;"></i> ${content}`;
            } else {
                messageDiv.innerHTML = `<i class="fas fa-user" style="margin-left: 0.5rem; color: #8aafff;"></i> ${content}`;
            }
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            
            if (!isSystem) {
                chatHistory.push({ role: type === 'user' ? 'user' : 'assistant', content });
                if (chatHistory.length > 10) {
                    chatHistory = chatHistory.slice(-10);
                }
            }
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            messagesContainer.appendChild(typingDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        // ============= بارگذاری مدل (نسخه سبک) =============
        async function loadModel() {
            try {
                statusText.textContent = 'در حال دانلود مغز...';
                statusDot.style.background = '#fbbf24';
                sendButton.disabled = true;
                userInput.disabled = true;

                // استفاده از GPT-2 (سبک‌تر و سریع‌تر)
                generator = await pipeline('text-generation', 'Xenova/gpt2', {
                    quantized: true,
                    progress_callback: (progress) => {
                        if (progress.status === 'downloading') {
                            const percent = Math.round(progress.progress * 100);
                            statusText.textContent = `دانلود ${percent}%`;
                            if (percent === 100) {
                                statusText.textContent = 'آماده‌سازی...';
                            }
                        }
                    }
                });

                // تست اولیه
                await generator('سلام', { max_new_tokens: 5 });
                
                isModelReady = true;
                statusText.textContent = 'آنلاین ✅';
                statusDot.style.background = '#4ade80';
                sendButton.disabled = false;
                userInput.disabled = false;
                userInput.focus();
                
                addMessage('ai', '🧠 مغزم آماده شد! هر سوالی داری بپرس.', true);
                
            } catch (error) {
                console.error('خطا:', error);
                statusText.textContent = 'خطا ❌';
                statusDot.style.background = '#ef4444';
                addMessage('ai', '❌ نتونستم مغزم رو بارگذاری کنم. لطفاً صفحه رو رفرش کن.', true);
            }
        }

        // ============= تولید پاسخ =============
        async function generateResponse(userMessage) {
            if (!generator || !isModelReady) {
                return '⏳ مغزم هنوز آماده نیست! لطفاً چند ثانیه صبر کن...';
            }

            try {
                // ساخت پرامپت ساده
                const prompt = `شما یک دستیار هوشمند به نام HomaAi هستید. به فارسی پاسخ دهید. 
                سوال: ${userMessage}
                پاسخ: `;

                const result = await generator(prompt, {
                    max_new_tokens: 150,
                    temperature: 0.8,
                    top_k: 40,
                    top_p: 0.9,
                    repetition_penalty: 1.2,
                    do_sample: true,
                });

                let response = result[0]?.generated_text || '';
                response = response.replace(prompt, '').trim();
                
                if (!response || response.length < 2) {
                    response = 'متاسفم، نتونستم جواب درستی پیدا کنم. لطفاً سوال دیگه‌ای بپرس.';
                }

                return response;

            } catch (error) {
                console.error('خطا:', error);
                return '⚠️ خطایی در پردازش رخ داد. دوباره تلاش کن.';
            }
        }

        // ============= ارسال پیام =============
        async function handleSend() {
            const message = userInput.value.trim();
            if (!message || isProcessing || !isModelReady) return;

            addMessage('user', message);
            userInput.value = '';
            isProcessing = true;
            sendButton.disabled = true;
            userInput.disabled = true;

            showTyping();

            try {
                const response = await generateResponse(message);
                removeTyping();
                addMessage('ai', response);
            } catch (error) {
                removeTyping();
                addMessage('ai', '❌ خطا در پردازش. لطفاً دوباره تلاش کن.');
                console.error(error);
            } finally {
                isProcessing = false;
                sendButton.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        // ============= رویدادها =============
        sendButton.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        // ============= شروع =============
        loadModel();

        // پیام راهنما بعد از ۵ ثانیه
        setTimeout(() => {
            if (!isModelReady) {
                addMessage('ai', '⏳ دانلود مغز ممکنه چند دقیقه طول بکشه... صبور باش!', true);
            }
        }, 5000);

        console.log('🧠 HomaAi در حال راه‌اندازی...');
    </script>
</body>
</html>
