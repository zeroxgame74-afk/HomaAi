<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomaAi</title>
    
    <!-- Font Awesome 6 (رایگان) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <!-- فونت وزیر (متن بُلد) -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />
    
    <style>
        /* ریست کامل و تمام‌صفحه */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0b0d15;
            color: #f0f3fa;
            font-family: 'Vazir', sans-serif;
            font-weight: 700; /* بُلد */
            display: flex;
            align-items: center;
            justify-content: center;
            direction: rtl;
        }

        /* کانتینر اصلی تمام‌صفحه با گرادیانت و افکت‌های خاص */
        .homa-container {
            width: 100%;
            max-width: 1400px;
            min-height: 100vh;
            padding: 2.5rem 2rem;
            background: radial-gradient(circle at 20% 30%, #1a1e2f, #0b0d15 80%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 50px rgba(0, 20, 255, 0.15);
            border-radius: 0;
            position: relative;
            overflow: hidden;
        }

        /* افکت هاله‌ی نورانی پشت سر */
        .homa-container::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -20%;
            width: 90%;
            height: 120%;
            background: radial-gradient(circle, rgba(70, 130, 255, 0.08), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* هدر + لوگو */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            z-index: 2;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            font-size: 2.8rem;
            color: #4a7cff;
            filter: drop-shadow(0 0 12px #4a7cff88);
            transition: 0.3s;
        }
        .logo-icon:hover {
            transform: rotate(-6deg) scale(1.05);
        }

        .logo-text {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #b0caff, #6a9aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .header-actions i {
            font-size: 1.6rem;
            margin-right: 1.4rem;
            color: #8b9bcc;
            transition: 0.25s;
            cursor: default;
        }
        .header-actions i:hover {
            color: #c6d9ff;
            transform: scale(1.15);
        }

        /* بخش میانی: چت‌بات */
        .chat-area {
            flex: 1;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2.5rem;
            margin: 1rem 0 2rem;
        }

        .chat-greeting {
            font-size: 2.8rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.5;
            text-shadow: 0 0 30px rgba(70, 130, 255, 0.2);
        }
        .chat-greeting span {
            color: #5e8cff;
            border-bottom: 3px solid #5e8cff;
            padding-bottom: 4px;
        }

        .chat-box {
            width: 100%;
            max-width: 820px;
            background: rgba(18, 22, 40, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 1.8rem 2.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 0 30px rgba(74, 124, 255, 0.05);
            transition: 0.3s;
        }
        .chat-box:hover {
            border-color: rgba(74, 124, 255, 0.3);
            box-shadow: 0 20px 70px rgba(0, 40, 200, 0.25);
        }

        .chat-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f0f6ff;
            font-family: 'Vazir', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            padding: 0.6rem 0;
        }
        .chat-box input::placeholder {
            color: #6b7ca8;
            font-weight: 400;
            font-size: 1rem;
        }

        .chat-box button {
            background: linear-gradient(135deg, #3a6aff, #1f4ad0);
            border: none;
            border-radius: 40px;
            padding: 0.8rem 2rem;
            color: #fff;
            font-family: 'Vazir', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 0 30px rgba(58, 106, 255, 0.35);
            letter-spacing: 0.3px;
        }
        .chat-box button i {
            font-size: 1.3rem;
        }
        .chat-box button:hover {
            transform: scale(1.02) translateY(-2px);
            background: linear-gradient(135deg, #5b83ff, #2b56e0);
            box-shadow: 0 0 50px #3a6aff88;
        }

        .chat-hint {
            font-size: 1rem;
            color: #6f81b0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255,255,255,0.02);
            padding: 0.4rem 1.4rem;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .chat-hint i {
            color: #4a7cff;
        }

        /* فوتر با آیکون‌های سوشال و ... */
        .footer {
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 1.5rem;
            margin-top: 1rem;
            color: #7a8bb8;
            font-weight: 400;
        }

        .footer-social i {
            font-size: 1.6rem;
            margin-left: 1.2rem;
            color: #6678a3;
            transition: 0.25s;
            cursor: default;
        }
        .footer-social i:hover {
            color: #a3bcf5;
            transform: translateY(-3px);
        }

        .footer-copy {
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        /* ریسپانسیو برای موبایل */
        @media (max-width: 700px) {
            .homa-container {
                padding: 1.8rem 1.2rem;
            }
            .logo-text {
                font-size: 1.6rem;
            }
            .chat-greeting {
                font-size: 2rem;
            }
            .chat-box {
                flex-wrap: wrap;
                padding: 1.2rem 1.5rem;
                border-radius: 32px;
            }
            .chat-box input {
                font-size: 1rem;
                width: 100%;
            }
            .chat-box button {
                width: 100%;
                justify-content: center;
                padding: 0.7rem;
            }
            .footer {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="homa-container">
        <!-- هدر -->
        <header class="header">
            <div class="logo-area">
                <i class="fas fa-feather-alt logo-icon"></i>
                <span class="logo-text">HomaAi</span>
            </div>
            <div class="header-actions">
                <i class="fas fa-bolt"></i>
                <i class="fas fa-sliders-h"></i>
                <i class="fas fa-user-astronaut"></i>
            </div>
        </header>

        <!-- بخش چت‌بات -->
        <section class="chat-area">
            <div class="chat-greeting">
                سلام، <span>HomaAi</span> <br />
                چطور می‌تونم کمک کنم؟
            </div>

            <div class="chat-box">
                <input type="text" placeholder="سوالت رو اینجا بپرس..." />
                <button>
                    <i class="fas fa-paper-plane"></i> بفرست
                </button>
            </div>

            <div class="chat-hint">
                <i class="fas fa-robot"></i> 
                هوشمند، سریع، همیشه همراه
            </div>
        </section>

        <!-- فوتر -->
        <footer class="footer">
            <div class="footer-social">
                <i class="fab fa-twitter"></i>
                <i class="fab fa-github"></i>
                <i class="fab fa-linkedin"></i>
                <i class="fab fa-youtube"></i>
            </div>
            <div class="footer-copy">
                <i class="far fa-copyright"></i> 2026 HomaAi — تمام‌صفحه با ❤️
            </div>
        </footer>
    </div>
</body>
</html>
